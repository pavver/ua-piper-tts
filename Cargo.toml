[package]
name = "ua-piper-tts"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "3.5"
num2words = { path = "../num2words_v2" }
actix-web = "4"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
