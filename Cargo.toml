[package]
name = "ua-piper-tts"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
num2words = { git = "https://github.com/pavver/num2words_v2" }
actix-web = "4.14.0"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.4", features = ["v4"] }
tokio = { version = "1.52.3", features = ["full"] }

[profile.release]
lto = true
strip = true
